[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-agent-ssh"
version = "0.1.0"
description = "MCP server for repo-scoped work on a paired PC over SSH, built on the cross-pc-ssh helper"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
